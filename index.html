<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dumbtype · tu lenguaje</title>
<style>
  :root {
    --bg: #14111d; --panel: #1d1929; --line: #2c2740;
    --txt: #ece7ff; --dim: #8a82a8; --acc: #ff7a59; --acc2: #7c5cff; --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--txt);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  header h1 .dot { color: var(--acc); }
  header .sub { color: var(--dim); font-size: 13px; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  select, .btn {
    font: inherit; font-size: 13px; font-weight: 600;
    background: var(--panel); color: var(--txt);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 12px; cursor: pointer; transition: .15s;
  }
  .btn:hover, select:hover { border-color: var(--acc2); }
  .btn.primary { background: var(--acc2); border-color: var(--acc2); }
  .btn.primary:hover { filter: brightness(1.1); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .pane { display: flex; flex-direction: column; overflow: hidden; }
  .editor { border-right: 1px solid var(--line); }
  .tabbar {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .tabbar .ttl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); padding: 0 8px; }
  .tab {
    font: inherit; font-size: 12px; font-weight: 600; color: var(--dim);
    background: none; border: none; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .tab.on { background: var(--bg); color: var(--txt); }
  #code {
    flex: 1; width: 100%; border: none; outline: none; resize: none;
    background: transparent; color: var(--txt);
    font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    font-size: 15px; line-height: 1.9; padding: 18px; tab-size: 2; white-space: pre;
  }
  .preview { background: #faf8ff; color: #1a1626; }
  .view { flex: 1; overflow: auto; }
  #render { padding: 28px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; min-height: 100%; }
  #htmlout { padding: 18px; margin: 0; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.6; color: #4a4264; white-space: pre-wrap; word-break: break-word; }
  .hidden { display: none !important; }
  .err { color: #c2358f; font-family: monospace; font-size: 13px; opacity: .65; }
  footer {
    padding: 7px 20px; border-top: 1px solid var(--line); background: var(--panel);
    font-size: 12px; color: var(--dim); display: flex; gap: 16px; align-items: center;
  }
  footer .ok { color: var(--ok); }
</style>
<style id="estilos-app"></style>
</head>
<body>
  <header>
    <h1>dumbtype<span class="dot">.</span></h1>
    <span class="sub">escribe en español → hazlo una app</span>
    <div class="tools">
      <select id="ejemplos" title="Cargar un ejemplo">
        <option value="">Ejemplos…</option>
        <option value="hola">👋 Hola mundo</option>
        <option value="landing">🚀 Landing page</option>
        <option value="form">✉️ Formulario</option>
        <option value="perfil">🦊 Perfil</option>
      </select>
      <button class="btn" id="copiar">Copiar HTML</button>
      <button class="btn primary" id="exportar">Exportar .html</button>
    </div>
  </header>

  <main>
    <div class="pane editor">
      <div class="tabbar"><span class="ttl">tu código</span></div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>
    <div class="pane preview">
      <div class="tabbar">
        <button class="tab on" data-tab="resultado">Resultado</button>
        <button class="tab" data-tab="html">HTML generado</button>
      </div>
      <div class="view" id="view-resultado"><div id="render"></div></div>
      <div class="view hidden" id="view-html"><pre id="htmlout"></pre></div>
    </div>
  </main>

  <footer>
    <span id="conteo">0 elementos</span>
    <span id="guardado" class="ok">guardado ✓</span>
    <span style="margin-left:auto; opacity:.6">dumbtype v3</span>
  </footer>

<script>
/* ============================================================
   dumbtype — un mini-lenguaje que se vuelve HTML
   ============================================================ */

/* --- CSS de la "app" generada (compartido entre preview y export) --- */
const ESTILOS_APP = `
  .el-titulo { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height:1.1; }
  .el-subtitulo { font-size: 21px; font-weight: 700; color: #4a4264; }
  .el-texto { font-size: 17px; line-height: 1.6; max-width: 560px; }
  .el-boton { font: inherit; font-weight: 600; font-size: 16px; padding: 12px 22px;
    border: none; border-radius: 12px; background: #7c5cff; color: #fff; cursor: pointer; transition: transform .1s; }
  .el-boton:active { transform: scale(.96); }
  .el-campo, .el-area { font: inherit; font-size: 16px; padding: 12px 16px;
    border: 2px solid #e0d8f5; border-radius: 12px; min-width: 280px; background: #fff; color: #1a1626; }
  .el-area { min-height: 90px; resize: vertical; width: 100%; max-width: 420px; }
  .el-imagen { max-width: 320px; border-radius: 16px; display:block; }
  .el-video { width: 360px; max-width: 100%; aspect-ratio: 16/9; border-radius: 14px; border: none; }
  .el-enlace { color: #7c5cff; font-size: 17px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .el-separador { width: 100%; max-width: 560px; border: none; border-top: 2px solid #e0d8f5; }
  .el-lista { font-size: 17px; line-height: 1.8; padding-left: 22px; }
  .el-emoji { font-size: 56px; line-height: 1; }
  .el-espacio { height: 24px; }

  .el-tarjeta { background: #fff; border-radius: 18px; padding: 22px;
    box-shadow: 0 8px 24px rgba(80,60,140,.10); display: flex; flex-direction: column;
    gap: 12px; align-items: flex-start; }
  .el-fila { display: flex; flex-direction: row; gap: 14px; align-items: center; flex-wrap: wrap; }
  .el-columna { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .el-centro { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; width: 100%; }

  /* modificadores */
  .mod-grande { font-size: 1.35em; }
  .mod-gigante { font-size: 1.9em; }
  .mod-chico { font-size: .8em; padding: 8px 14px; }
  .mod-pequeño { font-size: .8em; }
  .mod-rojo { background: #ef4444; color: #fff; }
  .mod-azul { background: #3b82f6; color: #fff; }
  .mod-verde { background: #22c55e; color: #fff; }
  .mod-amarillo { background: #facc15; color: #1a1626; }
  .mod-naranja { background: #fb923c; color: #1a1626; }
  .mod-rosa { background: #ec4899; color: #fff; }
  .mod-morado { background: #8b5cf6; color: #fff; }
  .mod-gris { background: #6b7280; color: #fff; }
  .mod-negro { background: #1a1626; color: #fff; }
  /* en textos y títulos el color va a la letra, no al fondo */
  .el-titulo.mod-rojo,.el-subtitulo.mod-rojo,.el-texto.mod-rojo,.el-emoji.mod-rojo { background: none; color: #ef4444; }
  .el-titulo.mod-azul,.el-subtitulo.mod-azul,.el-texto.mod-azul,.el-emoji.mod-azul { background: none; color: #3b82f6; }
  .el-titulo.mod-verde,.el-subtitulo.mod-verde,.el-texto.mod-verde,.el-emoji.mod-verde { background: none; color: #16a34a; }
  .el-titulo.mod-morado,.el-subtitulo.mod-morado,.el-texto.mod-morado,.el-emoji.mod-morado { background: none; color: #8b5cf6; }
  .el-titulo.mod-rosa,.el-subtitulo.mod-rosa,.el-texto.mod-rosa,.el-emoji.mod-rosa { background: none; color: #ec4899; }
  .mod-redondo { border-radius: 99px; }
  .mod-negrita { font-weight: 800; }
  .mod-cursiva { font-style: italic; }
  .mod-subrayado { text-decoration: underline; }
  .mod-centrado { align-self: center; text-align: center; }
  .mod-sombra { box-shadow: 0 12px 32px rgba(124,92,255,.32); }
  .mod-ancho { width: 100%; max-width: 560px; }

  #dumb-toasts { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 9999; }
  .dumb-toast { background: #1a1626; color: #fff; padding: 14px 22px; border-radius: 12px;
    font-family: system-ui, sans-serif; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    animation: dumbin .25s ease; }
  @keyframes dumbin { from { opacity: 0; transform: translateY(16px); } }
`;

/* --- Diccionario del lenguaje --- */
// contenedores aceptan hijos (líneas indentadas debajo)
const CONTENEDORES = new Set(['tarjeta', 'fila', 'columna', 'centro']);
// solo estos elementos pueden llevar acciones / funciones
const INTERACTIVOS = new Set(['boton', 'enlace']);

const MODIFICADORES = new Set([
  'grande','gigante','chico','pequeño',
  'rojo','azul','verde','amarillo','naranja','rosa','morado','gris','negro',
  'redondo','negrita','cursiva','subrayado','centrado','sombra','ancho'
]);

let FUNCIONES = {}; // { nombre: [ {accion, valor}, ... ] }

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function attr(s) { return esc(s).replace(/"/g,'&quot;'); }

function idYoutube(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  return m ? m[1] : '';
}

/* cómo se dibuja cada elemento. n = nodo, c = clases, dentro = hijos dibujados */
const DIBUJAR = {
  titulo:    (n,c) => `<div class="el-titulo ${c}">${esc(n.texto) || 'Título'}</div>`,
  subtitulo: (n,c) => `<div class="el-subtitulo ${c}">${esc(n.texto) || 'Subtítulo'}</div>`,
  texto:     (n,c) => `<div class="el-texto ${c}">${esc(n.texto)}</div>`,
  boton:     (n,c) => `<button class="el-boton ${c}" ${accionAttrs(n)}>${esc(n.texto) || 'Botón'}</button>`,
  campo:     (n,c) => `<input class="el-campo ${c}" placeholder="${attr(n.texto)}">`,
  area:      (n,c) => `<textarea class="el-area ${c}" placeholder="${attr(n.texto)}"></textarea>`,
  imagen:    (n,c) => `<img class="el-imagen ${c}" src="${attr(n.texto)}" alt="imagen">`,
  enlace:    (n,c) => `<a class="el-enlace ${c}" href="${n.accion==='abre' ? attr(n.valor) : '#'}" ${n.accion==='abre'?'target="_blank"':''} ${accionAttrs(n)}>${esc(n.texto) || 'enlace'}</a>`,
  separador: (n,c) => `<hr class="el-separador ${c}">`,
  espacio:   (n,c) => `<div class="el-espacio ${c}"></div>`,
  emoji:     (n,c) => `<div class="el-emoji ${c}">${esc(n.texto) || '⭐'}</div>`,
  lista:     (n,c) => `<ul class="el-lista ${c}">${n.texto.split(',').map(i => `<li>${esc(i.trim())}</li>`).join('')}</ul>`,
  video:     (n,c) => {
    const url = n.texto.trim();
    const yt = idYoutube(url);
    return yt
      ? `<iframe class="el-video ${c}" src="https://www.youtube.com/embed/${yt}" allowfullscreen></iframe>`
      : `<video class="el-video ${c}" src="${attr(url)}" controls></video>`;
  },
  // contenedores
  tarjeta:  (n,c,dentro) => `<div class="el-tarjeta ${c}">${dentro}</div>`,
  fila:     (n,c,dentro) => `<div class="el-fila ${c}">${dentro}</div>`,
  columna:  (n,c,dentro) => `<div class="el-columna ${c}">${dentro}</div>`,
  centro:   (n,c,dentro) => `<div class="el-centro ${c}">${dentro}</div>`,
};

function accionAttrs(n) {
  if (n.fn) return `data-fn="${attr(n.fn)}"`;
  if (n.accion) return `data-accion="${attr(n.accion)}" data-valor="${attr(n.valor)}"`;
  return '';
}

/* --- Parser: texto → árbol + funciones (según la indentación) --- */
function parsear(codigo) {
  const lineas = codigo.replace(/\t/g, '  ').split('\n');
  const raiz = { tipo: 'raiz', hijos: [] };
  const funciones = {};
  const pila = [{ nodo: raiz, indent: -1 }];
  let fnActual = null; // dentro de una definición de función

  for (const linea of lineas) {
    if (!linea.trim()) continue;
    const indent = linea.match(/^ */)[0].length;
    const texto = linea.trim();

    // ¿salimos de la función que estábamos definiendo?
    if (fnActual && indent <= fnActual.indent) fnActual = null;

    // línea indentada dentro de una función = un paso
    if (fnActual) { fnActual.pasos.push(parsearPaso(texto)); continue; }

    // definición de función:  funcion saludar()
    const def = texto.match(/^funci[oó]n\s+([a-zA-Z_]\w*)\s*\(\)/i);
    if (def) {
      funciones[def[1]] = [];
      fnActual = { indent, pasos: funciones[def[1]] };
      continue;
    }

    // elemento normal
    while (pila.length > 1 && indent <= pila[pila.length - 1].indent) pila.pop();
    const nodo = crearNodo(texto);
    pila[pila.length - 1].nodo.hijos.push(nodo);
    if (CONTENEDORES.has(nodo.tipo)) pila.push({ nodo, indent });
  }
  return { raiz, funciones };
}

function parsearPaso(texto) {
  const p = texto.split(/\s+/);
  return { accion: p[0].toLowerCase(), valor: p.slice(1).join(' ') };
}

function crearNodo(linea) {
  const tipo = (linea.split(/\s+/)[0] || '').toLowerCase();
  let accion = null, valor = null, fn = null, cuerpo = linea;

  // solo botones y enlaces interpretan acciones / funciones
  if (INTERACTIVOS.has(tipo)) {
    // atajo de un paso:  -> accion valor
    const flecha = cuerpo.indexOf('->');
    if (flecha !== -1) {
      const a = cuerpo.slice(flecha + 2).trim().split(/\s+/);
      accion = a[0].toLowerCase(); valor = a.slice(1).join(' ');
      cuerpo = cuerpo.slice(0, flecha).trim();
    }
    // llamada a función:  saludar()
    const llama = cuerpo.match(/([a-zA-Z_]\w*)\s*\(\)/);
    if (llama) {
      fn = llama[1];
      cuerpo = cuerpo.replace(llama[0], '').trim();
    } else {
      // acción inline entre paréntesis:  (mensaje Hola)
      const inl = cuerpo.match(/\(([^)]+)\)/);
      if (inl) {
        const a = inl[1].trim().split(/\s+/);
        accion = a[0].toLowerCase(); valor = a.slice(1).join(' ');
        cuerpo = cuerpo.replace(inl[0], '').trim();
      }
    }
  }

  const palabras = cuerpo.split(/\s+/).filter(Boolean);
  const mods = [], contenido = [];
  for (const p of palabras.slice(1)) {
    (MODIFICADORES.has(p.toLowerCase()) ? mods : contenido).push(p);
  }
  return { tipo, mods, texto: contenido.join(' '), accion, valor, fn, hijos: [] };
}

/* --- Render: árbol → HTML --- */
function dibujar(nodo) {
  if (nodo.tipo === 'raiz') return nodo.hijos.map(dibujar).join('\n');
  const fn = DIBUJAR[nodo.tipo];
  if (!fn) return `<div class="err"># no conozco "${esc(nodo.tipo)}" todavía</div>`;
  const clases = nodo.mods.map(m => 'mod-' + m).join(' ');
  const dentro = nodo.hijos.map(dibujar).join('\n');
  return fn(nodo, clases, dentro);
}

function contar(nodo) {
  let n = nodo.tipo === 'raiz' ? 0 : 1;
  for (const h of nodo.hijos) n += contar(h);
  return n;
}

/* --- Acciones (las cosas que un botón puede hacer) --- */
function ejecutarAccion(accion, valor) {
  if (accion === 'alerta') alert(valor);
  else if (accion === 'abre') window.open(valor, '_blank');
  else if (accion === 'mensaje') mostrarToast(valor);
}
function ejecutarFuncion(nombre) {
  var pasos = (typeof FUNCIONES !== 'undefined' && FUNCIONES[nombre]) || [];
  pasos.forEach(function (p) { ejecutarAccion(p.accion, p.valor); });
}
function mostrarToast(txt) {
  var cont = document.getElementById('dumb-toasts');
  if (!cont) { cont = document.createElement('div'); cont.id = 'dumb-toasts'; document.body.appendChild(cont); }
  var t = document.createElement('div');
  t.className = 'dumb-toast';
  t.textContent = txt;
  cont.appendChild(t);
  setTimeout(function () { t.remove(); }, 2600);
}
function manejarClick(e) {
  var b = e.target.closest('[data-fn],[data-accion]');
  if (!b) return;
  e.preventDefault();
  if (b.getAttribute('data-fn')) ejecutarFuncion(b.getAttribute('data-fn'));
  else ejecutarAccion(b.getAttribute('data-accion'), b.getAttribute('data-valor'));
}

/* --- Exportar: genera un archivo .html que funciona solo --- */
function generarHTMLApp() {
  const { raiz, funciones } = parsear(document.getElementById('code').value);
  const cuerpo = dibujar(raiz);
  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi app · hecha con dumbtype</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #faf8ff; color: #1a1626; }
  #app { padding: 32px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; max-width: 900px; margin: 0 auto; }
${ESTILOS_APP}
</style>
</head>
<body>
<div id="app">
${cuerpo}
</div>
<script>
var FUNCIONES = ${JSON.stringify(funciones).replace(/</g, '\\u003c')};
${ejecutarAccion.toString()}
${ejecutarFuncion.toString()}
${mostrarToast.toString()}
${manejarClick.toString()}
document.getElementById('app').addEventListener('click', manejarClick);
<\/script>
</body>
</html>`;
}

function descargar() {
  const blob = new Blob([generarHTMLApp()], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mi-app.html';
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('Descargado: mi-app.html');
}

async function copiarHTML() {
  try {
    await navigator.clipboard.writeText(generarHTMLApp());
    mostrarToast('HTML copiado al portapapeles');
  } catch (e) {
    mostrarToast('No se pudo copiar 😕');
  }
}

/* --- Plantillas de ejemplo --- */
const PLANTILLAS = {
  hola: `titulo gigante dumbtype
subtitulo tu lenguaje para hacer apps escribiendo español

  form: `titulo grande Contáctanos

/* --- Conectar todo --- */
const $code = document.getElementById('code');
const $render = document.getElementById('render');
const $htmlout = document.getElementById('htmlout');

function actualizar() {
  const { raiz, funciones } = parsear($code.value);
  FUNCIONES = funciones;
  $render.innerHTML = dibujar(raiz);
  $htmlout.textContent = generarHTMLApp();
  const nFn = Object.keys(funciones).length;
  document.getElementById('conteo').textContent =
    contar(raiz) + ' elementos' + (nFn ? ` · ${nFn} ${nFn === 1 ? 'función' : 'funciones'}` : '');
  localStorage.setItem('dumbtype', $code.value);
}

// inyectar estilos de la app en el preview
document.getElementById('estilos-app').textContent = ESTILOS_APP;

// acciones de botones/enlaces dentro del preview (delegación)
$render.addEventListener('click', manejarClick);

// pestañas Resultado / HTML
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  const tab = t.dataset.tab;
  document.getElementById('view-resultado').classList.toggle('hidden', tab !== 'resultado');
  document.getElementById('view-html').classList.toggle('hidden', tab !== 'html');
}));

// ejemplos
document.getElementById('ejemplos').addEventListener('change', e => {
  if (PLANTILLAS[e.target.value]) { $code.value = PLANTILLAS[e.target.value]; actualizar(); }
  e.target.value = '';
});

document.getElementById('exportar').addEventListener('click', descargar);
document.getElementById('copiar').addEventListener('click', copiarHTML);
$code.addEventListener('input', actualizar);

// arrancar con lo guardado (migra del nombre viejo si hace falta), o con el ejemplo "hola"
$code.value = localStorage.getItem('dumbtype') || localStorage.getItem('dumbtipe') || PLANTILLAS.hola;
actualizar();
</script>
